# Значения окружения (инфраструктура) и секреты.
#
# Всего мест со значениями три, по смыслу:
#   * docker/app.env      — продукт (лимиты, капча, сроки, брендинг) — этот файл
#                           не трогает; попадает в контейнер через env_file ниже;
#   * этот файл           — окружение: сеть, порты, ресурсы, профиль, JVM;
#   * .env                — секреты (см. .env.example), сюда приходят через
#                           ${VAR:?...}: отсутствующий или пустой секрет валит
#                           compose на старте.
# Схема — src/main/resources/application.properties (только обязательные ${VAR}
# без дефолтов); тест ApplicationConfigSchemaTest сверяет её с ключами этого
# файла и docker/app.env один в один.

# Общие с postgres значения, чтобы не дублировать их в двух сервисах.
# DB_URL приложения по умолчанию — основная БД: активна одна БД, шардирование
# в профиле `sharding` и выключено. Переключить приложение на прокси можно
# переменной DB_URL в .env (правка файла и пересборка не нужны):
#   DB_URL=jdbc:postgresql://shardingsphere:3307/desk
x-database-url: &database-url "${DB_URL:-jdbc:postgresql://postgres:5432/desk}"
x-database-user: &database-user "user"
x-database-name: &database-name "desk"

# Имя БД на шардах. Совпадает с основной (x-database-name): шарды получают её
# через POSTGRES_DB, прокси — через SHARD_DB, обе ссылки резолвятся из одного
# значения ${SHARD_DB:-desk}. Куда подключается приложение, решает DB_URL выше.
x-shard-database: &shard-database "${SHARD_DB:-desk}"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: realhelpdesk:latest
    container_name: realhelpdesk
    ports:
      - "8443:8443"

    # Укрепление контейнера (sec.md §7.9).
    read_only: true
    tmpfs:
      - /tmp                    # GC-лог, JFR, heap dump, java_error.log
      - /app/ssl:rw,uid=999,gid=999   # keystore; 999 — spring-user
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    memswap_limit: 768m

    # Продукт (значения, которые меняет проект, а не окружение) — в git,
    # отдельным файлом; в контейнер приходит как обычные переменные окружения.
    env_file:
      - ./docker/app.env

    environment:
      # Профиль
      SPRING_PROFILES_ACTIVE: debug

      # SERVER
      SERVER_PORT: 8443
      KEY_STORE_PATH: "file:ssl/keystore.p12"
      KEY_STORE_TYPE: "PKCS12"
      # Keystore генерируется при старте контейнера (docker/entrypoint.sh),
      # если свой файл не смонтирован в /app/ssl/keystore.p12.
      KEY_STORE_ALIAS: "tomcat"
      KEY_STORE_PASS: "${KEY_STORE_PASS:?KEY_STORE_PASS is required - copy .env.example to .env}"

      # PostgreSQL
      DB_URL: *database-url
      DB_USER: *database-user
      DB_PASS: "${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env}"

      # Миграции схемы (Liquibase): структуру создаёт changelog
      # src/main/resources/db/changelog, Hibernate в validate только сверяет
      # entity с ней. Изменения структуры — новый changeset, не правка руками.
      # Префикс DB_MIGRATIONS_, а не LIQUIBASE_: Liquibase 5 сам читает
      # LIQUIBASE_* из окружения и warns об этих именах как о «невалидных».
      DB_MIGRATIONS_ENABLED: "true"
      DB_MIGRATIONS_CHANGE_LOG: "classpath:db/changelog/db.changelog-master.xml"

      # JPA/Hibernate: режим задан в коде (application.properties, validate) и
      # окружением не управляется — так изменяющий схему режим нельзя вернуть
      # ни отсюда, ни из .env. show-sql/format-sql — отладочный вывод SQL.
      JPA_SHOW_SQL: "false"
      JPA_FORMAT_SQL: "true"

      # JWT: секрет — в .env, адреса выдачи — здесь (URL деплоя).
      # Сроки жизни и cookie — docker/app.env.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}"
      # Домены (схема — src/main/resources/application-domains.properties):
      # issuer/audience пишутся в токены и сверяются при валидации.
      JWT_ISSUER: "https://example.com"
      JWT_AUDIENCE: "https://example.com"
      # Origin'ы фронта для CORS, список через запятую (см. cors.allowed-origins).
      CORS_ALLOWED_ORIGINS: "https://localhost.ru,https://example.com"

      # Mail - SMTP: сервер окружения (smtp4dev). Адреса отправителя и
      # название писем — docker/app.env.
      MAIL_PROTOCOL: "smtp"
      MAIL_HOST: smtp
      MAIL_PORT: 25
      MAIL_USER: "user@example.com"
      # smtp4dev работает без аутентификации, поэтому пустое значение допустимо.
      MAIL_PASSWORD: "${MAIL_PASSWORD-}"
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"

      # Mail content: домен фронта в письмах (email.domain) зависит от окружения
      FRONT_DOMAIN: "front.example.ru"

      # Rate limit: брать клиентский IP из X-Forwarded-For (включать только
      # за прокси). Самы пороги — docker/app.env.
      TRUST_PROXY_HEADERS: "false"

      # JVM-диагностика по умолчанию выключена (sec.md §7.8): эти ключи
      # перекрывают ENV образа. Включение — docker-compose.debug.yaml.
      JAVA_JFR_OPTS: ""
      JAVA_HEAP_DUMP_OPTS: ""
      JAVA_NMT_OPTS: ""
      JAVA_JMX_OPTS: ""

      # Память: пустой JAVA_XMX переключает entrypoint на -XX:MaxRAMPercentage,
      # то есть heap масштабируется вместе с mem_limit (45% от 768m ≈ 345M).
      JAVA_XMX: ""
      JAVA_RAM_PERCENTAGE: "45"

    # Ждём именно готовность postgres (не просто «контейнер запущен»),
    # иначе Hibernate может успеть упасть до старта СУБД, а restart: on-failure:2
    # даст приложению только две попытки.
    depends_on:
      postgres:
        condition: service_healthy
      smtp:
        condition: service_started
    restart: on-failure:2

  postgres:
    # PostgreSQL 18 хранит данные в каталоге со своим мажорным версионом
    # (PGDATA=/var/lib/postgresql/18/docker), поэтому том монтируется на
    # /var/lib/postgresql — родительский каталог, а не .../data, как в 15–17.
    # Монтировать на /var/lib/postgresql/data нельзя: образ 18 считает такой
    # том остатком старой версии и завершает работу с подсказкой по
    # pg_upgrade (см. README, «Обновление PostgreSQL 15 → 18»).
    image: postgres:18
    mem_limit: 2g
    container_name: realhelpdesk_postgres
    environment:
      POSTGRES_USER: *database-user
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env}"
      POSTGRES_DB: *database-name
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: on-failure:2

  # Шардирование (инфраструктура): ShardingSphere-Proxy + два шарда.
  #
  # РЕЖИМ НЕАКТИВНОСТИ. Все три сервиса ниже объявлены в профиле `sharding`
  # и по умолчанию не поднимаются: активна одна БД — postgres. Конфигурация
  # шардирования (шаблоны, правила, схема шардов) при этом лежит в репозитории
  # и готова к включению:
  #   docker compose --profile sharding up -d          # включить
  #   COMPOSE_PROFILES=sharding в .env                 # то же самое в .env:
  #                                                    # обычный `up -d` поднимет всё
  #   docker compose stop shardingsphere postgres_shard_0 postgres_shard_1
  #                                                    # выключить (тома целы)
  #
  # Приложение с прокси НЕ связано: DB_URL по умолчанию — основной postgres.
  # Подключение — одна строка в .env при включённом профиле (см. x-database-url
  # и README, «Шардирование (ShardingSphere)»). Шарды уже содержат схему
  # приложения, правила — shardingsphere/conf/database-sharding.yaml; перед
  # переключением app нужен выбранный ключ шардирования с co-location
  # (см. комментарии в конфигурации прокси).
  shardingsphere:
    image: apache/shardingsphere-proxy:5.5.3
    mem_limit: 1g
    container_name: shardingsphere
    profiles: [sharding]
    restart: on-failure:2
    depends_on:
      postgres_shard_0:
        condition: service_healthy
      postgres_shard_1:
        condition: service_healthy
    ports:
      - "127.0.0.1:3307:3307"
    volumes:
      # Шаблоны конфигурации: паролей в git нет, entrypoint.sh подставляет
      # их из окружения при каждом старте и запускает start.sh.
      - ./shardingsphere/conf:/opt/shardingsphere/conf:ro
      - ./shardingsphere/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      PORT: 3307
      SHARD_DB: *shard-database
      SHARD_DB_USER: *database-user
      # Пароль данных-источников прокси = пароль шардов = DB_PASSWORD.
      # Свой ключ нужен, только если шарды вынесены на отдельную учётку.
      SHARD_DB_PASSWORD: "${SHARD_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env}}"
      # Пароли прокси обязательны, но только когда профиль sharding реально
      # включается: compose интерполирует весь файл и без профиля, поэтому
      # жёсткий ${VAR:?} здесь заваливал бы стек из одной БД. Пустое значение
      # отсекает сам entrypoint прокси — он не стартует без пароля (секрета
      # по умолчанию в git по-прежнему нет).
      SHARDINGSPHERE_ROOT_PASSWORD: "${SHARDINGSPHERE_ROOT_PASSWORD:-}"
      SHARDINGSPHERE_SHARDING_PASSWORD: "${SHARDINGSPHERE_SHARDING_PASSWORD:-}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3307'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Первый шард (профиль `sharding`, по умолчанию не поднимается). Схема
  # создаётся тем же файлом, который Liquibase применяет на основной базе, —
  # единственный источник правды (baseline не редактируется, копия в каталог
  # шарда не заводится).
  postgres_shard_0:
    image: postgres:18
    mem_limit: 2g
    container_name: postgres-shard-0
    profiles: [sharding]
    restart: on-failure:2
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_shard_0_data:/var/lib/postgresql
      - ./src/main/resources/db/changelog/sql/001-baseline-schema.sql:/docker-entrypoint-initdb.d/001-baseline-schema.sql:ro
    environment:
      POSTGRES_USER: *database-user
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env}"
      POSTGRES_DB: *shard-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Второй шард — зеркало первого (профиль `sharding`; тот же init-файл и
  # учётные данные).
  postgres_shard_1:
    image: postgres:18
    mem_limit: 2g
    container_name: postgres-shard-1
    profiles: [sharding]
    restart: on-failure:2
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_shard_1_data:/var/lib/postgresql
      - ./src/main/resources/db/changelog/sql/001-baseline-schema.sql:/docker-entrypoint-initdb.d/001-baseline-schema.sql:ro
    environment:
      POSTGRES_USER: *database-user
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env}"
      POSTGRES_DB: *shard-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  smtp:
    image: rnwood/smtp4dev
    container_name: realhelpdesk_smtp
    ports:
      - "127.0.0.1:25:25"
      - "3000:80"
    restart: on-failure:2

volumes:
  postgres_data:
  postgres_shard_0_data:
  postgres_shard_1_data:
