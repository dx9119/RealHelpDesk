# Единственное место со значениями конфигурации приложения.
#
# src/main/resources/application.properties — только схема (обязательные ${VAR}
# без дефолтов); тест EmailPropertiesTest сверяет схему и services.app.environment
# один в один. Секреты берутся из .env (см. .env.example) и подставляются
# через ${VAR:?...} — отсутствующий или пустой секрет валит compose на старте.

# Общие с postgres значения, чтобы не дублировать их в двух сервисах.
x-database-url: &database-url "jdbc:postgresql://postgres:5432/desk"
x-database-user: &database-user "user"
x-database-name: &database-name "desk"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: realhelpdesk:latest
    container_name: realhelpdesk
    ports:
      - "8443:8443"
    environment:
      # Профиль
      SPRING_PROFILES_ACTIVE: debug

      # APP
      APP_NAME: "Real help desk"

      # SERVER
      SERVER_PORT: 8443
      KEY_STORE_PATH: "file:ssl/keystore.p12"
      KEY_STORE_TYPE: "PKCS12"
      # Keystore генерируется при старте контейнера (docker/entrypoint.sh),
      # если свой файл не смонтирован в /app/ssl/keystore.p12.
      KEY_STORE_ALIAS: "tomcat"
      KEY_STORE_PASS: "${KEY_STORE_PASS:?KEY_STORE_PASS is required - copy .env.example to .env}"

      # PostgreSQL
      DB_URL: *database-url
      DB_USER: *database-user
      DB_PASS: "${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env}"

      # JPA/Hibernate
      JPA_DDL_AUTO: "create-drop"
      JPA_SHOW_SQL: "false"
      JPA_FORMAT_SQL: "true"
      JPA_OSIV: "false"

      # JWT
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}"
      JWT_ISSUER: "https://example.com"
      JWT_AUDIENCE: "https://example.com"
      JWT_ACCESS_TOKEN_EXPIRATION: 60
      JWT_REFRESH_TOKEN_EXPIRATION: 43200
      JWT_COOKIE_SAMESITE: "None"

      # Mail - SMTP
      MAIL_PROTOCOL: "smtp"
      MAIL_HOST: smtp
      MAIL_PORT: 25
      MAIL_USER: "user@example.com"
      # smtp4dev работает без аутентификации, поэтому пустое значение допустимо.
      MAIL_PASSWORD: "${MAIL_PASSWORD-}"
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"

      # Mail addresses
      EMAIL_DOMAIN: "example.com"
      MAIL_FROM: "noreply@example.com"
      MAIL_NOTIFY: "admin@example.com"

      # Mail content
      FRONT_DOMAIN: "front.example.ru"
      APP_PROJECT_NAME: "real help desk"

      # Captcha
      CAPTCHA_ENABLED: "false"

      # Rate limit: брать клиентский IP из X-Forwarded-For (включать только за прокси)
      TRUST_PROXY_HEADERS: "false"

      # Rate limit: пороги (число запросов / окно в секундах).
      # Ключ должен совпадать с key в аннотации @RateLimit на методе контроллера.
      RATE_LIMIT_AUTH_REGISTER_REQUESTS: 10
      RATE_LIMIT_AUTH_REGISTER_WINDOW_SECONDS: 300
      RATE_LIMIT_AUTH_LOGIN_REQUESTS: 10
      RATE_LIMIT_AUTH_LOGIN_WINDOW_SECONDS: 300
      RATE_LIMIT_AUTH_ACCESS_TOKEN_REQUESTS: 30
      RATE_LIMIT_AUTH_ACCESS_TOKEN_WINDOW_SECONDS: 300
      RATE_LIMIT_CAPTCHA_REQUESTS: 30
      RATE_LIMIT_CAPTCHA_WINDOW_SECONDS: 60
      RATE_LIMIT_PASSWORD_RESET_REQUEST_REQUESTS: 3
      RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW_SECONDS: 600
      RATE_LIMIT_PASSWORD_RESET_CONFIRM_REQUESTS: 5
      RATE_LIMIT_PASSWORD_RESET_CONFIRM_WINDOW_SECONDS: 600
      RATE_LIMIT_EMAIL_CODE_REQUESTS: 3
      RATE_LIMIT_EMAIL_CODE_WINDOW_SECONDS: 600
      # Лимит писем восстановления пароля на один адрес (окно 86400 сек = 24 часа)
      RATE_LIMIT_EMAIL_RECOVERY_REQUESTS: 3
      RATE_LIMIT_EMAIL_RECOVERY_WINDOW_SECONDS: 86400

    depends_on:
      - postgres
      - smtp
    restart: on-failure:2

  postgres:
    image: postgres:15
    container_name: realhelpdesk_postgres
    environment:
      POSTGRES_USER: *database-user
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env}"
      POSTGRES_DB: *database-name
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: on-failure:2

  smtp:
    image: rnwood/smtp4dev
    container_name: realhelpdesk_smtp
    ports:
      - "127.0.0.1:25:25"
      - "3000:80"
    restart: on-failure:2

volumes:
  postgres_data:
