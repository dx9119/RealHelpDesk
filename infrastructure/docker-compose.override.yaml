# Локальная разработка: переопределяет базовый docker-compose.yaml.
# Подхватывается docker compose автоматически (когда нет -f) и входит в явный
# набор Makefile (make up). В рабочем стеке этот файл НЕ участвует.

services:
  app:
    # Стеки-оверлеи подключаются ПОСЛЕ базового stack.env — выигрывает последний
    env_file:
      - ../scripts/docker/stack.local.env

  # Локальный SMTP: smtp4dev без аутентификации, UI — http://localhost:3000.
  # Порты привязаны к loopback, как и остальные сервисы на хосту.
  smtp:
    image: rnwood/smtp4dev:3.15.0
    mem_limit: 64m
    ports:
      - "127.0.0.1:25:25"
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
