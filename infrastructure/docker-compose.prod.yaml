# Рабочий контур: переопределяет базовый docker-compose.yaml.
# Запуск: make up-prod (явный набор файлов, override НЕ подхватывается).
#
# Отличия от локального: только env-оверлей stack.prod.env — smtp-сервиса здесь
# нет (приложение ходит в внешний SMTP), CORS/капча/SameSite — prod-дефолты
# базового stack.env. Перед первым запуском заполните stack.prod.env и
# infrastructure/.env (см. .env.example), смонтируйте keystore с реальным
# сертификатом в /app/ssl/keystore.p12 (prod-preflight отвергнет CN=localhost).

services:
  app:
    env_file:
      - ../scripts/docker/stack.prod.env
