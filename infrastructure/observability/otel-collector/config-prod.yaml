# Прод-пример конфига OTel Collector (obs.md, шаг 11): хвостовой сэмплинг.
# Политика: ошибки (status_code=ERROR) и трейсы дольше 1000 ms сохраняются целиком,
# остальное — 10% (probabilistic). Подключение (prod-оверлей):
#   volumes:
#     - ./observability/otel-collector/config-prod.yaml:/etc/otelcol/config.yaml:ro
# Решение принимается ПОСЛЕ завершения span'ов (decision_wait), поэтому endpoint приёма
# должен терпеть буферизацию: память collector'а растёт с num_traces.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    expected_new_traces_per_sec: 2000
    policies:
      # Все трейсы с ошибкой — целиком
      - name: errors-policy
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Медленные операции (> 1 s) — целиком
      - name: slow-policy
        type: latency
        latency:
          threshold_ms: 1000
      # Остальное — 10%
      - name: probabilistic-policy
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlp/tempo]
