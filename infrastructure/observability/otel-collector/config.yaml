# OTel Collector (obs.md, шаг 11): OTLP-приёмник → batch → Tempo.
# Приложение шлёт трейсы на OTLP_TRACING_ENDPOINT (в оверлее — http://otel-collector:4317).
# Сэмплинг по умолчанию — только приём и батчинг: доля запросов решается management.tracing.sampling
# в приложении. Прод-пример с хвостовым сэмплингом (ошибки и медленные трейсы целиком, остальное 10%)
# — в config-prod.yaml рядом; подключается монтированием поверх config.yaml.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
