# Provisioning datasources Grafana: Prometheus, Tempo, Loki
# подключаются автоматически — руками в UI ничего добавлять не нужно.
# Связи: Tempo → Loki (tracesToLogs по traceId), Loki → Tempo (derived-поле TraceID),
# Tempo → Prometheus (serviceMap для карты зависимостей).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Логи — текстовый паттерн с колонкой traceId (32 hex) между role и logger.
      derivedFields:
        - name: TraceID
          matcherRegex: '\| ([a-f0-9]{32}) \|'
          datasourceUid: tempo
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      tracesToLogs:
        datasourceUid: loki
        customQuery: true
        # traceId в логах — обычная подстрока текстового паттерна.
        query: '{container_label_com_docker_compose_service="app"} |= "$${__span.traceId}"'
        mappedTags:
          - key: traceId
            value: traceId
        filterMatchAny: false
        tags: ["traceId"]
      tracesToMetrics:
        datasourceUid: prometheus
