# Prometheus (obs.md, шаг 11 — часть инфраструктуры наблюдаемости).
#
# Скрейпит управляющий порт приложения (management.server.port, HTTP Basic
# сервисной учёткой METRICS_USER/METRICS_PASSWORD — те же креды, что
# проверяются в ActuatorSecurityTest).
#
# ВАЖНО: Prometheus НЕ подставляет переменные окружения в конфигурационный
# файл (env-замена документируется только для external_labels), поэтому
# basic_auth.username/password пишутся литерально, а пароль читается из
# отдельного файла (username_file/password_file). Файлы кладёт
# `make up-observability` из infrastructure/.env в
# infrastructure/observability/prometheus/secrets/ (каталог в .gitignore);
# compose монтирует каталог в /etc/prometheus/secrets:ro.
#
# Открывать управляющий порт наружу при этом не нужно: Prometheus живёт в той
# же сети compose и ходит по app:8081 (loopback-проброс на хост есть для отладки).

global:
  # Один интервал и для скрейпа, и для правил: 15 s — дефолт Prometheus,
  # укладывается в ожидание алертов шага 12 (evaluation_interval).
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: realhelpdesk
    metrics_path: /actuator/prometheus
    basic_auth:
      username_file: /etc/prometheus/secrets/metrics_user
      password_file: /etc/prometheus/secrets/metrics_password
    static_configs:
      - targets: ["app:8081"]
