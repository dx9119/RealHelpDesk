# Шардирование (инфраструктура): ShardingSphere-Proxy + два шарда.
# Подключается последним к базовому compose (make up-sharding):
#   docker-compose.yaml + docker-compose.override.yaml + docker-compose.sharding.yaml
#
# РЕЖИМ НЕАКТИВНОСТИ. Все три сервиса ниже по умолчанию не поднимаются: их
# нет в базовом файле, активна одна БД — postgres. Конфигурация шардирования
# (шаблоны, правила, схема шардов) лежит в репозитории и готова к включению:
#   make up-sharding                               # включить
#   make down-sharding                             # выключить (тома целы)
#
# Приложение с прокси НЕ связано: DB_URL по умолчанию — основной postgres
# (scripts/docker/stack.env). Подключение — одна строка в infrastructure/.env
# при включённом шардинге:
#   DB_URL=jdbc:postgresql://shardingsphere:3307/desk
# Шарды уже содержат схему приложения, правила —
# infrastructure/shardingsphere/conf/database-sharding.yaml; перед
# переключением app нужен выбранный ключ шардирования с co-location
# (см. комментарии в конфигурации прокси).

services:
  shardingsphere:
    image: apache/shardingsphere-proxy:5.5.3
    mem_limit: 1g
    depends_on:
      postgres_shard_0:
        condition: service_healthy
      postgres_shard_1:
        condition: service_healthy
    ports:
      - "127.0.0.1:3307:3307"
    volumes:
      # Шаблоны конфигурации: паролей в git нет, entrypoint.sh подставляет
      # их из окружения при каждом старте и запускает start.sh.
      - ./shardingsphere/conf:/opt/shardingsphere/conf:ro
      - ./shardingsphere/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      # Имена БД/пользователя и порт прокси — дефолты stack.env (desk/user/3307)
      PORT: "3307"
      SHARD_DB: "${SHARD_DB:-desk}"
      SHARD_DB_USER: "${SHARD_DB_USER:-user}"
      # Пароль данных-источников прокси = пароль шардов = DB_PASSWORD.
      # Свой ключ нужен, только если шарды вынесены на отдельную учётку.
      SHARD_DB_PASSWORD: "${SHARD_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}}"
      # Пароли прокси обязательны при шардинге: пустое значение отсекает сам
      # entrypoint прокси — он не стартует без пароля (секрета по умолчанию
      # в git по-прежнему нет, см. infrastructure/.env.example).
      SHARDINGSPHERE_ROOT_PASSWORD: "${SHARDINGSPHERE_ROOT_PASSWORD:?SHARDINGSPHERE_ROOT_PASSWORD is required for sharding - copy infrastructure/.env.example to infrastructure/.env}"
      SHARDINGSPHERE_SHARDING_PASSWORD: "${SHARDINGSPHERE_SHARDING_PASSWORD:?SHARDINGSPHERE_SHARDING_PASSWORD is required for sharding - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3307'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Первый шард. Схема создаётся тем же файлом, который Liquibase применяет
  # на основной базе, — единственный источник правды (baseline не редактируется,
  # копия в каталог шарда не заводится).
  postgres_shard_0:
    image: postgres:18
    mem_limit: 2g
    shm_size: 256m
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_shard_0_data:/var/lib/postgresql
      - ../src/main/resources/db/changelog/sql/001-baseline-schema.sql:/docker-entrypoint-initdb.d/001-baseline-schema.sql:ro
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-user}"
      POSTGRES_DB: "${POSTGRES_DB:-desk}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Второй шард — зеркало первого (тот же init-файл и учётные данные).
  postgres_shard_1:
    image: postgres:18
    mem_limit: 2g
    shm_size: 256m
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_shard_1_data:/var/lib/postgresql
      - ../src/main/resources/db/changelog/sql/001-baseline-schema.sql:/docker-entrypoint-initdb.d/001-baseline-schema.sql:ro
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-user}"
      POSTGRES_DB: "${POSTGRES_DB:-desk}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
