services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: realhelpdesk:latest
    container_name: realhelpdesk
    ports:
      - "8443:8443"
    read_only: true
    tmpfs:
      - /tmp
      - /app/ssl:rw,uid=999,gid=999
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    memswap_limit: 768m
    env_file:
      - ../scripts/docker/stack.env
    environment:
      KEY_STORE_PASS: "${KEY_STORE_PASS:?KEY_STORE_PASS is required - copy infrastructure/.env.example to infrastructure/.env}"
      DB_PASS: "${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - copy infrastructure/.env.example to infrastructure/.env}"
      MAIL_PASSWORD: "${MAIL_PASSWORD-}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - copy infrastructure/.env.example to infrastructure/.env}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    depends_on:
      postgres:
        condition: service_healthy
      smtp:
        condition: service_started
      minio:
        condition: service_healthy
    restart: on-failure:2

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    mem_limit: 1g
    container_name: realhelpdesk_minio
    restart: on-failure:2
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    env_file:
      - ../scripts/docker/stack.env
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - copy infrastructure/.env.example to infrastructure/.env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: server /data --console-address ":9001"

  postgres:
    # PostgreSQL 18 хранит данные в каталоге со своим мажорным версионом
    # (PGDATA=/var/lib/postgresql/18/docker), поэтому том монтируется на
    # /var/lib/postgresql — родительский каталог, а не .../data, как в 15–17.
    # Монтировать на /var/lib/postgresql/data нельзя: образ 18 считает такой
    # том остатком старой версии и завершает работу с подсказкой по pg_upgrade.
    image: postgres:18
    mem_limit: 2g
    container_name: realhelpdesk_postgres
    env_file:
      - ../scripts/docker/stack.env
    environment:
      # POSTGRES_USER и POSTGRES_DB приходят из stack.env, пароль — секрет из
      # infrastructure/.env (пустой или отсутствующий валит запуск).
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: on-failure:2

  # Шардирование (инфраструктура): ShardingSphere-Proxy + два шарда.
  #
  # РЕЖИМ НЕАКТИВНОСТИ. Все три сервиса ниже объявлены в профиле `sharding`
  # и по умолчанию не поднимаются: активна одна БД — postgres. Конфигурация
  # шардирования (шаблоны, правила, схема шардов) при этом лежит в репозитории
  # и готова к включению:
  #   make up-sharding                            # включить
  #   COMPOSE_PROFILES=sharding в infrastructure/.env  # то же самое в .env:
  #                                                # обычный `up` поднимет всё
  #   docker compose stop shardingsphere postgres_shard_0 postgres_shard_1
  #                                                # выключить (тома целы)
  #
  # Приложение с прокси НЕ связано: DB_URL по умолчанию — основной postgres
  # (scripts/docker/stack.env). Подключение — одна строка в infrastructure/.env
  # при включённом профиле:
  #   DB_URL=jdbc:postgresql://shardingsphere:3307/desk
  # Шарды уже содержат схему приложения, правила —
  # infrastructure/shardingsphere/conf/database-sharding.yaml; перед
  # переключением app нужен выбранный ключ шардирования с co-location
  # (см. комментарии в конфигурации прокси).
  shardingsphere:
    image: apache/shardingsphere-proxy:5.5.3
    mem_limit: 1g
    container_name: shardingsphere
    profiles: [sharding]
    restart: on-failure:2
    depends_on:
      postgres_shard_0:
        condition: service_healthy
      postgres_shard_1:
        condition: service_healthy
    ports:
      - "127.0.0.1:3307:3307"
    env_file:
      - ../scripts/docker/stack.env
    volumes:
      # Шаблоны конфигурации: паролей в git нет, entrypoint.sh подставляет
      # их из окружения при каждом старте и запускает start.sh.
      - ./shardingsphere/conf:/opt/shardingsphere/conf:ro
      - ./shardingsphere/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      # PORT, SHARD_DB и SHARD_DB_USER приходят из stack.env.
      # Пароль данных-источников прокси = пароль шардов = DB_PASSWORD.
      # Свой ключ нужен, только если шарды вынесены на отдельную учётку.
      SHARD_DB_PASSWORD: "${SHARD_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}}"
      # Пароли прокси обязательны, но только когда профиль sharding реально
      # включается: compose интерполирует весь файл и без профиля, поэтому
      # жёсткий ${VAR:?} здесь заваливал бы стек из одной БД. Пустое значение
      # отсекает сам entrypoint прокси — он не стартует без пароля (секрета
      # по умолчанию в git по-прежнему нет).
      SHARDINGSPHERE_ROOT_PASSWORD: "${SHARDINGSPHERE_ROOT_PASSWORD:-}"
      SHARDINGSPHERE_SHARDING_PASSWORD: "${SHARDINGSPHERE_SHARDING_PASSWORD:-}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3307'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Первый шард (профиль `sharding`, по умолчанию не поднимается). Схема
  # создаётся тем же файлом, который Liquibase применяет на основной базе, —
  # единственный источник правды (baseline не редактируется, копия в каталог
  # шарда не заводится).
  postgres_shard_0:
    image: postgres:18
    mem_limit: 2g
    container_name: postgres-shard-0
    profiles: [sharding]
    restart: on-failure:2
    ports:
      - "127.0.0.1:5433:5432"
    env_file:
      - ../scripts/docker/stack.env
    volumes:
      - postgres_shard_0_data:/var/lib/postgresql
      - ../src/main/resources/db/changelog/sql/001-baseline-schema.sql:/docker-entrypoint-initdb.d/001-baseline-schema.sql:ro
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Второй шард — зеркало первого (профиль `sharding`; тот же init-файл и
  # учётные данные).
  postgres_shard_1:
    image: postgres:18
    mem_limit: 2g
    container_name: postgres-shard-1
    profiles: [sharding]
    restart: on-failure:2
    ports:
      - "127.0.0.1:5434:5432"
    env_file:
      - ../scripts/docker/stack.env
    volumes:
      - postgres_shard_1_data:/var/lib/postgresql
      - ../src/main/resources/db/changelog/sql/001-baseline-schema.sql:/docker-entrypoint-initdb.d/001-baseline-schema.sql:ro
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  smtp:
    image: rnwood/smtp4dev
    container_name: realhelpdesk_smtp
    ports:
      - "127.0.0.1:25:25"
      - "3000:80"
    restart: on-failure:2

volumes:
  postgres_data:
  postgres_shard_0_data:
  postgres_shard_1_data:
  minio_data:
