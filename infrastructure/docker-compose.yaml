# Базовый compose: безопасный дефолт рабочего контура (infraReview.md, п. 8–18).
# Явный набор файлов (в Makefile):
#   локально: docker-compose.yaml + docker-compose.override.yaml  (make up)
#   prod:     docker-compose.yaml + docker-compose.prod.yaml      (make up-prod)
#   шардинг:  + docker-compose.sharding.yaml                      (make up-sharding)
# Без -f docker сам подхватит override-файл (только локально!) — prod и шардинг
# всегда запускаются через make с явным набором.
#
# База не содержит smtp: локальный smtp4dev лежит в override, рабочий SMTP
# приложение берёт из stack.env/stack.prod.env (MAIL_HOST). Секреты — только
# через ${VAR:?} из infrastructure/.env (шаблон .env.example).

# Имя проекта compose: фиксировано, чтобы наборы файлов видели одни и те же тома
name: realhelpdesk

# Логи контейнеров: json-file с ротацией — docker logs не раздувает диск
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  backend:

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Ревизия git для LABEL org.opencontainers.image.revision (Makefile передаёт)
        GIT_SHA: "${GIT_SHA:-unknown}"
    image: realhelpdesk:latest
    ports:
      - "8443:8443"
    read_only: true
    tmpfs:
      # JVM пишет ErrorFile/heap dump в /tmp; uid/gid приложения — 10001 (Dockerfile)
      - /tmp:size=64m
      - /app/ssl:rw,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    memswap_limit: 768m
    env_file:
      - ../scripts/docker/stack.env
    environment:
      # Только секреты: несекретные ключи — в scripts/docker/stack.env
      # (парность контроллирует ApplicationConfigSchemaTest)
      KEY_STORE_PASS: "${KEY_STORE_PASS:?KEY_STORE_PASS is required - copy infrastructure/.env.example to infrastructure/.env}"
      DB_PASS: "${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - copy infrastructure/.env.example to infrastructure/.env}"
      MAIL_PASSWORD: "${MAIL_PASSWORD-}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - copy infrastructure/.env.example to infrastructure/.env}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # TCP-проба без curl/wget в образе JRE: bash /dev/tcp открывает сокет
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8443'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - backend
    logging: *default-logging
    labels:
      org.opencontainers.image.source: "https://github.com/dx9119/RealHelpDesk"

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    mem_limit: 1g
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - copy infrastructure/.env.example to infrastructure/.env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - backend
    logging: *default-logging

  postgres:
    # PostgreSQL 18 хранит данные в каталоге со своим мажорным версионом
    # (PGDATA=/var/lib/postgresql/18/docker), поэтому том монтируется на
    # /var/lib/postgresql — родительский каталог, а не .../data, как в 15–17.
    # Монтировать на /var/lib/postgresql/data нельзя: образ 18 считает такой
    # том остатком старой версии и завершает работу с подсказкой по pg_upgrade.
    image: postgres:18
    mem_limit: 2g
    # Общедоступный shared_buffers: PostgreSQL по умолчанию считает, что у него
    # весь хост, и shm-сегмент ломается при ограничении памяти контейнера
    shm_size: 256m
    environment:
      # Имя БД и пользователь — с дефолтами stack.env (user/desk); переопределяются
      # infrastructure/.env (POSTGRES_USER/POSTGRES_DB), пароль — секрет.
      POSTGRES_USER: "${POSTGRES_USER:-user}"
      POSTGRES_DB: "${POSTGRES_DB:-desk}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - backend
    logging: *default-logging

volumes:
  postgres_data:
  postgres_shard_0_data:
  postgres_shard_1_data:
  minio_data:
