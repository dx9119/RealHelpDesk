# Load-оверлей: стек для нагрузочного тестирования (scripts/load/, k6).
# Подключается третьим файлом после base + override (make up-load / make load):
#   docker-compose.yaml + docker-compose.override.yaml + docker-compose.load.yaml
#
# Что меняет:
#   app  — TRUST_PROXY_HEADERS=true: приложение читает X-Forwarded-For, каждая
#          k6-VU шлёт уникальный адрес и получает свой bucket рейт-лимитов.
#          Без этого все VU делят один 127.0.0.1 и логин упирается в 10/300с.
#          Включать ТОЛЬКО локально: за этим профилем нет прокси, кто угодно
#          может подставить чужой IP (см. ClientIpResolver).
#   k6   — контейнер grafana/k6: ходит в app по внутренней сети https://app:8443,
#          скрипт монтируется из scripts/load/.

services:
  app:
    environment:
      TRUST_PROXY_HEADERS: "true"
      CLIENT_IP_FORWARDED_INDEX: "0"

  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - ../scripts/load:/scripts:ro
    working_dir: /scripts
    entrypoint: ["k6"]
    command: ["run", "/scripts/user-journey.js"]
    environment:
      BASE_URL: https://app:8443
      POOL_SIZE: ${POOL_SIZE:-8}
      TARGET_VUS: ${TARGET_VUS:-10}
      DURATION: ${DURATION:-5m}
      THINK_TIME: ${THINK_TIME:-1}
      WAIT_TIMEOUT_SEC: ${WAIT_TIMEOUT_SEC:-3}
      # RUN_ID подставляет scripts/load/run.sh через docker compose run -e
      RUN_ID: ${RUN_ID:-local}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
