# Оверлей наблюдаемости: Mimir, Grafana, Tempo, OTel Collector, Loki, Alloy.
# Подключается после базы + override (make obs-up):
#   docker-compose.yaml + docker-compose.override.yaml + docker-compose.observability.yaml
# Для нагрузочного прогона вместе с метриками — добавьте fourth файл
# docker-compose.load.yaml (TRUST_PROXY_HEADERS для k6).
#
# Топология: приложение шлёт трейсы OTLP → otel-collector → tempo; логи (stdout json-file
# приложения) тянет alloy → loki; метрики alloy скрейпит с app:8081 и шлёт
# remote_write в mimir; grafana прокидывает datasources через provisioning
# (см. observability/grafana/).

services:
  # Приложение в этом стеке шлёт трейсы в collector (OTLP/HTTP — дефолтный
  # протокол экспорта Spring Boot; endpoint передаётся как полный URL с /v1/traces).
  app:
    environment:
      OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces

  mimir:
    # Mimir (monolithic): хранение метрик, Prometheus-совместимый API, ruler.
    # Версия закреплена: обновление — осознанная правка с ревью, не latest.
    image: grafana/mimir:2.16.0
    mem_limit: 512m
    ports:
      # Только loopback: query API /prometheus и ruler (хостовой порт 9090,
      # как у прежнего Prometheus — make obs-alerts и curl не меняются по адресу).
      - "127.0.0.1:9090:8090"
    volumes:
      - ./observability/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      # Правила алертов (Prometheus-формат); проверка — promtool check rules.
      # Раскладка local store: <dir>/<tenant>/<файл>, tenant=anonymous.
      - ./observability/mimir/rules:/etc/mimir/rules:ro
      # Fallback-конфиг встроенного Alertmanager (storage пуст — без него 412).
      - ./observability/mimir/alertmanager-fallback.yml:/etc/mimir/alertmanager-fallback.yml:ro
      - mimir_data:/data
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  otel-collector:
    # Версия закреплена; конфиг — OTLP → batch → Tempo (см. observability/otel-collector/).
    image: otel/opentelemetry-collector-contrib:0.162.0
    mem_limit: 256m
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - tempo
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tempo:
    # Хранилище трейсов (filesystem + WAL); retention 48h задан в tempo.yaml.
    image: grafana/tempo:2.8.0
    mem_limit: 512m
    ports:
      # Только loopback, для отладки (/ready, поиск trace по API).
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  loki:
    # Single-binary, filesystem-хранилище; слушает только внутреннюю сеть + loopback.
    # root: образ Loki по умолчанию идёт под nobody и не может создать /var/loki/{chunks,rules}
    # в новом volume; локальный dev-стенд, сеть loopback.
    image: grafana/loki:3.5.0
    user: "0:0"
    mem_limit: 256m
    ports:
      # Только loopback, для отладки (/ready, query_range).
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/var/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  alloy:
    # Сбор логов приложения (docker json-file, фильтр compose-метки service=app) → Loki
    # и скрейп метрик (app:8081/actuator/prometheus, HTTP Basic) → remote_write в Mimir.
    # root нужен для доступа к /var/run/docker.sock — локальный dev-стенд, сеть loopback.
    image: grafana/alloy:v1.12.2
    user: "0:0"
    mem_limit: 128m
    # Креды скрейпа: sys.env() в config.alloy читает их для basic_auth.
    env_file:
      - ../scripts/docker/stack.env
    environment:
      METRICS_PASSWORD: "${METRICS_PASSWORD:?METRICS_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    depends_on:
      - loki
      - mimir
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  grafana:
    # UI наблюдаемости: datasources и dashboards provisioning (observability/grafana/).
    image: grafana/grafana:12.4.13
    mem_limit: 256m
    ports:
      # Только loopback. 3001, а не 3000: 3000 обычно занят dev-сервером фронтенда.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      # Пароль администратора — секрет infrastructure/.env (задайте GRAFANA_ADMIN_PASSWORD).
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anonymous off: дашборды приватны, вход — админом из .env.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - mimir
      - tempo
      - loki
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mimir_data:
  tempo_data:
  loki_data:
  grafana_data:
  alloy_data:
