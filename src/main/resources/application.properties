# debug — локальная отладка; prod — рабочий контур. Переопределяется переменной SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# APP
spring.application.name=${APP_NAME:my-spring-application}

# SERVER
server.port=${SERVER_PORT:8443}
server.ssl.key-store=file:ssl/${KEY_STORE:keystore.p12}
server.ssl.key-store-password=${KEY_STORE_PASS:demo-keystore-pass}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${KEY_STORE_ALIAS:tomcat}

# Уровни логов задают application-debug.properties и application-prod.properties.

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:desk}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASS:pass}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# OSIV
spring.jpa.open-in-view=${JPA_OSIV:false}

# JWT
jwt.secret-for-gen-jwt=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:your-app-issuer}
jwt.audience=${JWT_AUDIENCE:your-app-audience}
jwt.access-token-expiration=60
jwt.refresh-token-expiration=43200
# SameSite для auth-cookie: None — кросс-доменный фронт; Lax — фронт на том же сайте
jwt.cookie.same-site=${JWT_COOKIE_SAMESITE:None}

# Mail - SMTP
spring.mail.protocol=smtp
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USER:user@example.com}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# Mail addresses
mail.domain=${EMAIL_DOMAIN:example.com}
email.from=noreply@${mail.domain}
email.notify=admin@${mail.domain}

# Mail content
email.domain=${FRONT_DOMAIN:front.example.ru}
email.project-name=${APP_PROJECT_NAME:real help desk}

# Captcha
captcha.enabled=${CAPTCHA_ENABLED:false}

# Rate limit: брать клиентский IP из X-Forwarded-For (включать только за прокси)
ratelimit.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}

# Rate limit: пороги (число запросов / окно в секундах), переопределяются переменными окружения RATE_LIMIT_*.
# Ключ должен совпадать с key в аннотации @RateLimit на методе контроллера.
ratelimit.limits.auth-register.requests=${RATE_LIMIT_AUTH_REGISTER_REQUESTS:10}
ratelimit.limits.auth-register.window-seconds=${RATE_LIMIT_AUTH_REGISTER_WINDOW_SECONDS:300}
ratelimit.limits.auth-login.requests=${RATE_LIMIT_AUTH_LOGIN_REQUESTS:10}
ratelimit.limits.auth-login.window-seconds=${RATE_LIMIT_AUTH_LOGIN_WINDOW_SECONDS:300}
ratelimit.limits.auth-access-token.requests=${RATE_LIMIT_AUTH_ACCESS_TOKEN_REQUESTS:30}
ratelimit.limits.auth-access-token.window-seconds=${RATE_LIMIT_AUTH_ACCESS_TOKEN_WINDOW_SECONDS:300}
ratelimit.limits.captcha.requests=${RATE_LIMIT_CAPTCHA_REQUESTS:30}
ratelimit.limits.captcha.window-seconds=${RATE_LIMIT_CAPTCHA_WINDOW_SECONDS:60}
ratelimit.limits.password-reset-request.requests=${RATE_LIMIT_PASSWORD_RESET_REQUEST_REQUESTS:3}
ratelimit.limits.password-reset-request.window-seconds=${RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW_SECONDS:600}
ratelimit.limits.password-reset-confirm.requests=${RATE_LIMIT_PASSWORD_RESET_CONFIRM_REQUESTS:5}
ratelimit.limits.password-reset-confirm.window-seconds=${RATE_LIMIT_PASSWORD_RESET_CONFIRM_WINDOW_SECONDS:600}
ratelimit.limits.email-code.requests=${RATE_LIMIT_EMAIL_CODE_REQUESTS:3}
ratelimit.limits.email-code.window-seconds=${RATE_LIMIT_EMAIL_CODE_WINDOW_SECONDS:600}
# Лимит писем восстановления пароля на один адрес (окно 86400 сек = 24 часа)
ratelimit.limits.email-recovery.requests=${RATE_LIMIT_EMAIL_RECOVERY_REQUESTS:3}
ratelimit.limits.email-recovery.window-seconds=${RATE_LIMIT_EMAIL_RECOVERY_WINDOW_SECONDS:86400}
