# ===========================================================================
# Схема конфигурации: только обязательные переменные окружения вида ${VAR} —
# без дефолтов.
#
# Значения — в scripts/docker/stack.env (продукт, окружение приложения,
# инфраструктура). Секреты (JWT_SECRET, DB_PASSWORD, MAIL_PASSWORD,
# KEY_STORE_PASS) берутся из infrastructure/.env и подставляются в infrastructure/docker-compose.yaml,
# см. infrastructure/.env.example.
#
# Исключение одно и намеренное — spring.jpa.hibernate.ddl-auto: режим
# закреплён здесь, окружением не управляется, чтобы изменяющий схему режим
# нельзя было вернуть ни через compose, ни через infrastructure/.env. Перечень исключений —
# NON_SCHEMA_KEYS в ApplicationConfigSchemaTest (он же следит, чтобы
# деструктивный режим не появился нигде в конфигурации среды).
#
# Отсутствующая переменная валит приложение на старте с
# "Could not resolve placeholder '<VAR>'" — тихих подстановок нет.
#
# Доменные имена и URL вынесены в application-domains.properties — он
# подключён ниже через spring.config.import.
# ===========================================================================

# Домены: токены, ссылки в письмах, CORS. Обязательный импорт — без него
# эти ключи просто не попадут в контекст, а ApplicationConfigSchemaTest
# сверяет схему обоих файлов с scripts/docker/stack.env и services.app.environment.
spring.config.import=classpath:application-domains.properties

# debug — локальная отладка; prod — рабочий контур.
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# APP
spring.application.name=${APP_NAME}

# SERVER
server.port=${SERVER_PORT}
server.ssl.key-store=${KEY_STORE_PATH}
server.ssl.key-store-password=${KEY_STORE_PASS}
server.ssl.key-store-type=${KEY_STORE_TYPE}
server.ssl.key-alias=${KEY_STORE_ALIAS}

# Уровни логов задают application-debug.properties и application-prod.properties.

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA/Hibernate
# Режим закреплён в коде (см. шапку файла): Liquibase ведёт структуру, Hibernate
# только сверяет entity с ней и валит старт при расхождении. Схема БД при
# рестарте и при падении процесса не трогается, данных не теряется.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}

# Liquibase: миграции схемы выполняются до старта Hibernate, который в режиме
# validate сверяет entity с результатом миграции (db/changelog/db.changelog-master.xml).
spring.liquibase.enabled=${DB_MIGRATIONS_ENABLED}
spring.liquibase.change-log=${DB_MIGRATIONS_CHANGE_LOG}

# OSIV
spring.jpa.open-in-view=${JPA_OSIV}

# JWT (issuer и audience — домены, см. application-domains.properties)
jwt.secret-for-gen-jwt=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}
# SameSite для auth-cookie: None — кросс-доменный фронт; Lax — фронт на том же сайте.
# Допустимые значения (весь набор — enum SameSite в коде): None, Lax, Strict.
# Регистр не важен (None/none/NONE), неизвестное значение валит старт приложения.
jwt.cookie.same-site=${JWT_COOKIE_SAMESITE}
# Домен для auth-cookie: пусто — cookie привязан к конкретному хосту (host-only,
# как раньше); .example.com — общий для поддоменов, без него файлы на отдельном
# домене (static.base-url) браузеру не отправить — скачивание вернёт 401.
jwt.cookie.domain=${JWT_COOKIE_DOMAIN}

# Mail - SMTP
spring.mail.protocol=${MAIL_PROTOCOL}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS}
# Таймауты SMTP (obs.md, шаг 9): без них Jakarta Mail ждёт до 2 минут на мёртвый сервер —
# зависает и отправка, и health-проверка. connect 3 с, ответ сервера и запись 10 с.
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Mail content (домены писем — в application-domains.properties)
email.project-name=${APP_PROJECT_NAME}

# Captcha
captcha.enabled=${CAPTCHA_ENABLED}

# IP клиента (логи и ключ рейт-лимита): заголовки прокси доверяем только за прокси,
# порядок заголовков — через запятую, индекс элемента списка (0 — первый слева, -1 — справа)
client-ip.trust-proxy-headers=${TRUST_PROXY_HEADERS}
client-ip.headers=${CLIENT_IP_HEADERS}
client-ip.forwarded-index=${CLIENT_IP_FORWARDED_INDEX}

# Rate limit: пороги (число запросов / окно в секундах), задаются в scripts/docker/stack.env.
# Ключ должен совпадать с key в аннотации @RateLimit на методе контроллера.
ratelimit.limits.auth-register.requests=${RATE_LIMIT_AUTH_REGISTER_REQUESTS}
ratelimit.limits.auth-register.window-seconds=${RATE_LIMIT_AUTH_REGISTER_WINDOW_SECONDS}
ratelimit.limits.auth-login.requests=${RATE_LIMIT_AUTH_LOGIN_REQUESTS}
ratelimit.limits.auth-login.window-seconds=${RATE_LIMIT_AUTH_LOGIN_WINDOW_SECONDS}
ratelimit.limits.auth-access-token.requests=${RATE_LIMIT_AUTH_ACCESS_TOKEN_REQUESTS}
ratelimit.limits.auth-access-token.window-seconds=${RATE_LIMIT_AUTH_ACCESS_TOKEN_WINDOW_SECONDS}
ratelimit.limits.captcha.requests=${RATE_LIMIT_CAPTCHA_REQUESTS}
ratelimit.limits.captcha.window-seconds=${RATE_LIMIT_CAPTCHA_WINDOW_SECONDS}
ratelimit.limits.password-reset-request.requests=${RATE_LIMIT_PASSWORD_RESET_REQUEST_REQUESTS}
ratelimit.limits.password-reset-request.window-seconds=${RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW_SECONDS}
ratelimit.limits.password-reset-confirm.requests=${RATE_LIMIT_PASSWORD_RESET_CONFIRM_REQUESTS}
ratelimit.limits.password-reset-confirm.window-seconds=${RATE_LIMIT_PASSWORD_RESET_CONFIRM_WINDOW_SECONDS}
ratelimit.limits.email-code.requests=${RATE_LIMIT_EMAIL_CODE_REQUESTS}
ratelimit.limits.email-code.window-seconds=${RATE_LIMIT_EMAIL_CODE_WINDOW_SECONDS}
# Лимит писем восстановления пароля на один адрес (окно 86400 сек = 24 часа)
ratelimit.limits.email-recovery.requests=${RATE_LIMIT_EMAIL_RECOVERY_REQUESTS}
ratelimit.limits.email-recovery.window-seconds=${RATE_LIMIT_EMAIL_RECOVERY_WINDOW_SECONDS}
# Long polling оповещений: клиент держит один ожидающий запрос ~25 сек
ratelimit.limits.notifications-wait.requests=${RATE_LIMIT_NOTIFICATIONS_WAIT_REQUESTS}
ratelimit.limits.notifications-wait.window-seconds=${RATE_LIMIT_NOTIFICATIONS_WAIT_WINDOW_SECONDS}
# Передача портала (эндпоинты с проверкой пароля)
ratelimit.limits.portal-transfer-request.requests=${RATE_LIMIT_PORTAL_TRANSFER_REQUEST_REQUESTS}
ratelimit.limits.portal-transfer-request.window-seconds=${RATE_LIMIT_PORTAL_TRANSFER_REQUEST_WINDOW_SECONDS}
ratelimit.limits.portal-transfer-confirm.requests=${RATE_LIMIT_PORTAL_TRANSFER_CONFIRM_REQUESTS}
ratelimit.limits.portal-transfer-confirm.window-seconds=${RATE_LIMIT_PORTAL_TRANSFER_CONFIRM_WINDOW_SECONDS}

# MinIO — хранилище файлов вложений заявок (сами файлы в бакете, метаданные в
# attachment_model). Адрес и имя бакета — scripts/docker/stack.env; учётки —
# infrastructure/docker-compose.yaml (секреты из infrastructure/.env).
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

# Multipart-загрузка: предел на один файл и на весь запрос. Превышение — 413
# (GlobalExceptionHandler), а не обрыв соединения.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}

# Cache-Control для отдачи файлов вложений (GET .../attachments/{id}): значение
# уходит в заголовок как есть. private, no-store — ничто не кэширует (дефолт);
# для CDN — обычно public, max-age=..., но только когда доступ к файлу не завязан
# на cookie (авторизация на edge CDN), иначе закрытый файл может отдать кэш.
# Пустое значение — как до настройки, private, no-store.
static.cache-control=${STATIC_CACHE_CONTROL}

# ===========================================================================
# Ниже — литералы, одинаковые для всех окружений (infraReview.md, §7).
# Это исключения из схемы ${VAR}: перечень NON_SCHEMA_KEYS в
# ApplicationConfigSchemaTest следит, чтобы новых литералов в файле не
# появлялось мимо списка, а env-управляемые ключи остались в stack.env.
# ===========================================================================

# --- Пул соединений (Hikari): дефолт из 10 соединений меняем осознанно ---
# Имя пула — тег pool в метриках hikaricp.connections.* (obs.md, шаг 5): без него в метрике
# фигурировало бы безликовое HikariPool-1, и по имени пула нельзя было бы отличить среду.
spring.datasource.hikari.pool-name=app-main
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
# Порог диагностики утечки соединения: Hikari пишет стек владельца в лог
spring.datasource.hikari.leak-detection-threshold=20000

# --- Hibernate: батчи (смыкается с n1.md: батч-инсерты рассылки и батч-фетч) ---
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Медленные запросы (obs.md, шаг 5): WARN при превышении порога (мс).
# hibernate.log_slow_query в Hibernate 7 — это порог в миллисекундах (long),
# а не boolean-флаг: булево значение роняет старт с NumberFormatException.
spring.jpa.properties.hibernate.log_slow_query=1000

# --- Корректное завершение: в системе long polling на 25 секунд и @Scheduled ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true

# --- Actuator / метрики (obs.md, шаги 2–3) ---
# Наружу отдаются только health, info и prometheus: env, heapdump, threaddump,
# configprops, beans, mappings в exposure не входят и недоступны.
management.endpoints.web.exposure.include=health,info,prometheus
# Детали health — только аутентифицированному запросу управляющего порта.
management.endpoint.health.show-details=when-authorized
# Пробы оркестратора: liveness — только сам процесс (БД/почта/MinIO не должны
# перезапускать под), readiness — процесс + БД + MinIO: балансировщик перестаёт
# слать трафик при недоступном хранилище файлов (obs.md, шаги 5 и 9).
# Почта — отдельная группа вне liveness/readiness: сбой SMTP не должен
# перезапускать под и останавливать трафик (obs.md, шаг 9). Имя группы не
# может совпадать с именем contributor'а (Boot 4: «clashes with group»),
# поэтому группа smtp, а блок в деталях — mail.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,minio
management.endpoint.health.group.smtp.include=mail
# Гистограмма и SLO-бакеты для http.server.requests: нужны для p50/p95/p99 и
# алертов по перцентилям. Клиентских percentiles (METER-префикс) не включаем.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,3s
# Потолок уникальных значений тега uri: Boot добавляет MeterFilter maximumAllowableTags
# и DENYит метрику сверх лимита, чтобы случайный путь не раздувал cardinality (obs.md, шаг 4).
management.metrics.web.server.max-uri-tags=100
# Отключение неиспользуемых семейств метрик (obs.md, шаг 10; список согласован
# по замеру /actuator/prometheus — см. docs/observability/metrics.md).
# Каждый ключ гасит биндер целиком, что дешевле, чем deny-фильтр на каждый meter.
# tomcat: сессии не используются (stateless JWT) — tomcat_sessions_* всегда шум.
management.metrics.enable.tomcat=false
# hibernate.cache: L2-кэш не подключён — hibernate.cache.* всегда нули.
management.metrics.enable.hibernate.cache=false
# hibernate.entities/collections: счётчики CRUD сущностей дублируют
# hibernate.query.executions и hibernate.statements.
management.metrics.enable.hibernate.entities=false
management.metrics.enable.hibernate.collections=false
# spring.security.filterchains: ~30 семейств before/after-таймеров фильтров;
# 401 и ошибки доступа уже видны в http.server.requests и auth.attempts.
management.metrics.enable.spring.security.filterchains=false
# spring.security.http.secured.requests / authorizations: дублируют
# http.server.requests (uri, status, role).
management.metrics.enable.spring.security.http.secured.requests=false
management.metrics.enable.spring.security.authorizations=false
# spring.data.repository: таймеры по каждому методу репозитория дублируют
# hibernate.query.executions.
management.metrics.enable.spring.data.repository=false
# Экспорт метрик в формате Prometheus.
management.prometheus.metrics.export.enabled=true
# Теги всех метрик: application — имя сервиса, env — активный профиль (debug/prod).
# Отдельная переменная ENV не вводилась, чтобы метка не разъехалась с профилем;
# instance не задаём — метку target добавляет сам Prometheus при скрейпе.
management.metrics.tags.application=${APP_NAME}
management.metrics.tags.env=${SPRING_PROFILES_ACTIVE}
# --- Распределённая трассировка (obs.md, шаг 6) ---
# Sampling: 1.0 на локальном стенде (debug), 0.1 в prod (через env) — доля запросов,
# попадающих в трейс; 0 полностью выключает трейсинг.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY}
# Resource-атрибуты спанов: service.name — имя сервиса, service.version — версия сборки,
# deployment.environment — активный профиль (debug/prod).
management.opentelemetry.resource-attributes.service.name=${APP_NAME}
management.opentelemetry.resource-attributes.service.version=${OTEL_SERVICE_VERSION}
management.opentelemetry.resource-attributes.deployment.environment=${SPRING_PROFILES_ACTIVE}
# OTLP-экспортёр: endpoint бэкенда Collector'а (gRPC по умолчанию; localhost:4317 для локального
# jaeger/otel-collector). Пустое значение отключает экспорт (спаны не уходят, SDK создаётся noop).
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT}

# --- Структурированные логи (obs.md, шаг 7) ---
# service.*-поля JSON-записей в профилях кроме debug: имя сервиса берётся из spring.application.name,
# окружение и версия — здесь (в logback-spring.xml включены только в !debug; debug остаётся читаемым).
logging.structured.ecs.service.environment=${SPRING_PROFILES_ACTIVE}
logging.structured.ecs.service.version=${OTEL_SERVICE_VERSION}

# Управляющий порт отдельен от приложения: actuator не живёт на SERVER_PORT,
# на основном порту /actuator/** отвечает 404/401 (obs.md, шаг 3).
# SSL управляющего порта выключен явно: иначе management наследует server.ssl.*
# приложения, и /actuator/prometheus требует TLS (Prometheus шлёт обычный HTTP,
# скрейп падает с 400). Порт светится только loopback и сети compose, Basic-креды
# скрейпа — в infrastructure/.env.
management.server.port=${MANAGEMENT_PORT}
management.server.address=${MANAGEMENT_ADDRESS}
management.server.ssl.enabled=false
# HTTP Basic на /actuator/prometheus: сервисная учётка METRICS_USER/METRICS_PASSWORD
# (пароль — секрет из infrastructure/.env). false — без проверки пароля,
# только если управляющий порт закрыт сетью.
observability.prometheus.auth.enabled=true
observability.prometheus.auth.username=${METRICS_USER}
observability.prometheus.auth.password=${METRICS_PASSWORD}
