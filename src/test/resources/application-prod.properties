# Тесты активируют prod (см. application.properties в этой же папке), поэтому
# нужен профильный перекрыватель: test- resources идут в classpath первыми и
# затеняют src/main/resources/application-prod.properties. Без этого
# закреплённый в prod-файле spring.liquibase.enabled=true включал бы миграции
# в слайс-тестах (@DataJpaTest) — Liquibase свалился бы к changelog по
# умолчанию, которого не существует.
spring.liquibase.enabled=false
