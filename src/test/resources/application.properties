# Конфигурация тестов (mvn test на хосте — в Docker тесты не ходят).
#
# Файл перекрывает src/main/resources/application.properties: тестовые ресурсы
# идут в classpath первыми, поэтому контекст тестов видит только эту конфигурацию.
# Это обязательно: продовая application.properties целиком состоит из
# обязательных ${VAR} без дефолтов, которые в тестовом окружении не заданы.

spring.profiles.active=prod
